<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Michelle Nastasis – Author, Professional Poker Player & Storyteller</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--d:#1a0910;--l:#fbf3e8;--p:#f0508c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--d);color:var(--l);font:16px/1.6 'Inter',system-ui,sans-serif}
h1,h2,h3,b,.sf{font-family:'Playfair Display',Georgia,serif;font-weight:500}.sc{font-family:'Great Vibes',cursive;font-weight:400;margin:0}
a{color:inherit;text-decoration:none}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 4vw;background:var(--d);position:relative;z-index:6;border-bottom:1px solid rgba(251,243,232,.15)}
nav a{display:inline-block;margin-right:26px;padding:4px 0;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;transition:.3s}
nav a:hover,nav a.on{color:var(--p);border-color:var(--p)}
#m{display:none;background:none;border:0;color:var(--l);font-size:1.7rem;cursor:pointer;justify-self:start}#m:hover{color:var(--p)}
.logo{text-align:center;transition:.3s}.logo:hover{color:var(--p)}.logo svg{display:block;margin:0 auto}
.logo b{display:block;font-size:clamp(1.05rem,2.4vw,1.5rem);letter-spacing:.05em;text-transform:uppercase;line-height:1.1}.logo i{font:normal 1.25rem/1.2 'Great Vibes',cursive}
.soc{text-align:right}.soc a{display:inline-grid;place-items:center;width:26px;height:26px;margin-left:8px;border-radius:50%;background:var(--l);color:var(--d);font-size:.62rem;font-weight:600;transition:.3s}.soc a:hover{background:var(--p);color:#fff;transform:translateY(-3px)}
@media(max-width:860px){#m{display:block}nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--d);padding:8px 4vw 18px}nav.o{display:block}nav a{display:block;margin:12px 0}header{grid-template-columns:48px 1fr 48px}.soc a:nth-child(n+2){display:none}}
section{position:relative;overflow:hidden}.d{background:var(--d);color:var(--l)}.l{background:var(--l);color:var(--d)}
.w{position:relative;z-index:2;max-width:1100px;margin:auto;padding:46px 4vw}.w:has(.mt){max-width:none;padding:0}
.r{opacity:0;transform:translateY(32px);transition:opacity .9s,transform .9s}.r.v{opacity:1;transform:none}
.ht{display:flex;align-items:center;gap:18px;justify-content:center;margin:0 0 22px;font-size:clamp(1.1rem,2.4vw,1.5rem);text-transform:uppercase;letter-spacing:.08em}
.ht::before,.ht::after{content:'';flex:1;max-width:260px;height:1px;background:currentColor;opacity:.35}
.sub{text-align:center;margin:-10px auto 22px;opacity:.8}
.btn{display:inline-block;margin-top:14px;padding:9px 26px;border:2px solid var(--p);background:var(--p);color:#fff;border-radius:40px;font-size:.74rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.3s}
.btn.o{background:transparent;color:var(--p)}.btn.o:hover{color:#fff}
.d .btn:hover{background:var(--l);border-color:var(--l);color:var(--d);transform:translateY(-3px)}.l .btn:hover{background:var(--d);border-color:var(--d);color:var(--l);transform:translateY(-3px)}
.hero{min-height:400px;display:flex;align-items:center}.hero .w{padding-top:64px;padding-bottom:64px;width:100%}.hx{max-width:52%;animation:up 1s both}
.hero h1{font-size:clamp(2.8rem,8vw,5.2rem);line-height:1.05;margin:0}.hero .sc{font-size:clamp(2rem,4.5vw,3rem);margin:4px 0 14px}
.hi{position:absolute;right:0;top:0;height:100%;width:60%;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%);animation:fi 1.4s both}
@keyframes up{from{opacity:0;transform:translateY(30px)}}@keyframes fi{from{opacity:0}}
@media(max-width:800px){.hx{max-width:100%}.hi{width:100%;opacity:.35}}
.vid{display:grid;grid-template-columns:1.1fr 1fr;gap:34px;align-items:center}.vid h2{font-size:clamp(1.4rem,3vw,2rem);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px}
.th{position:relative;border-radius:12px;overflow:hidden;display:block}.th img{width:100%;display:block;transition:transform .6s}.th:hover img{transform:scale(1.06)}
.pl{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;animation:pu 2s infinite;transition:.3s}.th:hover .pl{background:var(--l);color:var(--p)}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(240,80,140,.6)}100%{box-shadow:0 0 0 22px rgba(240,80,140,0)}}
.ns{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}.ns .sc{font-size:clamp(2rem,4vw,2.8rem)}.ns p{margin:0;max-width:260px;padding-left:22px;border-left:1px solid rgba(251,243,232,.35)}
.ns form,.fm{display:flex;gap:0}input,textarea{padding:11px 14px;border:1px solid currentColor;background:transparent;color:inherit;font:inherit;width:100%;border-radius:6px;transition:.3s}input:focus,textarea:focus{border-color:var(--p);outline:0}
.ns input{width:260px;border-radius:6px 0 0 6px}.ns .btn{margin:0;border-radius:0 6px 6px 0}
.br{display:flex;justify-content:center;gap:clamp(14px,3.5vw,48px);flex-wrap:wrap}.bi{width:150px;text-align:center;display:flex;flex-direction:column;align-items:center}
.bi img{width:112px;box-shadow:6px 8px 16px rgba(0,0,0,.4);transition:.4s;border-radius:2px}.bi:hover img{transform:translateY(-10px) rotate(-2deg);box-shadow:0 14px 28px rgba(240,80,140,.5)}
.bi b{font-size:.92rem;margin-top:12px}.bi small{opacity:.65}.bi .btn{padding:6px 18px;font-size:.66rem}
.mt{display:grid;grid-template-columns:minmax(180px,26%) 1fr 1.15fr;align-items:stretch}.mt img{width:100%;height:100%;object-fit:cover;display:block}.mt>div{padding:36px 28px}
.mt h2{font-size:1.7rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.stt{display:flex;align-items:center;justify-content:space-around;text-align:center;border-left:1px solid rgba(251,243,232,.3);padding:0 10px}.stt div{padding:6px 18px;border-left:1px solid rgba(251,243,232,.3)}.stt div:first-child{border:0}.stt b{display:block;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.2}.stt span{letter-spacing:.1em;font-size:.78rem}
@media(max-width:860px){.mt{grid-template-columns:1fr}.mt img{height:260px}.stt{border:0;padding:18px 0;flex-wrap:wrap}.vid{grid-template-columns:1fr}}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}@media(max-width:800px){.g4{grid-template-columns:repeat(2,1fr)}}
.c{position:relative;aspect-ratio:16/7;border-radius:12px;overflow:hidden;display:block;background:var(--d)}@media(max-width:800px){.c{aspect-ratio:4/3}}
.c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.c span{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(26,9,16,.92));color:var(--l);font:500 1rem 'Playfair Display',serif;transition:.3s}
.c:hover img{transform:scale(1.1)}.c:hover{box-shadow:0 0 0 2px var(--p),0 10px 26px rgba(240,80,140,.4)}.c:hover span{color:var(--p)}
.gi{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;transition:.4s}.gi:hover{transform:scale(1.05);box-shadow:0 0 0 2px var(--p),0 10px 26px rgba(240,80,140,.4)}
.mk{display:flex;justify-content:center;gap:clamp(16px,4vw,44px);flex-wrap:wrap;padding:6px 0 14px}.mk img{width:128px;transform:perspective(500px) rotateY(24deg) rotateZ(-5deg);box-shadow:8px 12px 20px rgba(0,0,0,.45);transition:.5s}.mk img:hover{transform:perspective(500px) rotateY(0) scale(1.1);box-shadow:0 14px 30px rgba(240,80,140,.5)}
.rv{background:var(--l);color:var(--d);border-radius:12px;padding:14px;text-align:center;transition:.35s}.l .rv{background:var(--d);color:var(--l)}.rv:hover{transform:translateY(-6px);box-shadow:0 10px 26px rgba(240,80,140,.45)}
.rv q{display:block;font:500 .98rem/1.35 'Playfair Display',serif;quotes:none}.rv em{display:block;font-size:.76rem;margin-top:6px;opacity:.7;font-style:normal}.rv i{display:block;color:var(--p);font:normal 2rem/.6 'Playfair Display',serif;height:18px}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.sp.f>:first-child{order:2}.sp h2{font-size:1.9rem;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.sp img{width:100%;border-radius:12px;aspect-ratio:4/3;object-fit:cover;transition:.4s}.sp img:hover{box-shadow:0 0 0 2px var(--p),0 12px 30px rgba(240,80,140,.4)}.sp img.cv{aspect-ratio:auto;max-width:240px;justify-self:center;border-radius:2px}
@media(max-width:800px){.sp{grid-template-columns:1fr;gap:22px}.sp.f>:first-child{order:0}}
.fm{flex-direction:column;gap:12px}.tg a{display:inline-block;margin:5px;padding:6px 18px;border:1px solid currentColor;border-radius:30px;font-size:.85rem;transition:.3s}.tg a:hover{background:var(--p);border-color:var(--p);color:#fff;transform:translateY(-3px)}.tg{text-align:center}
.cta{text-align:center}.cta .btn{margin:6px}
footer{background:var(--d);padding:30px 4vw 18px}.fg{display:grid;grid-template-columns:1fr 1.2fr 1fr;max-width:1100px;margin:auto}.fg>div{padding:0 26px;text-align:center}.fg>div+div{border-left:1px solid rgba(251,243,232,.3)}
.fg h3{margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;font-size:1.1rem}.fi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;transition:.3s}.fi img:hover{transform:scale(1.1);box-shadow:0 0 0 2px var(--p)}
.cp{text-align:center;font-size:.72rem;opacity:.75;margin-top:22px;padding-top:12px;border-top:1px solid rgba(251,243,232,.25)}.cp a:hover{color:var(--p)}
@media(max-width:860px){.fg{grid-template-columns:1fr;gap:24px}.fg>div+div{border:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.r{opacity:1;transform:none}}
</style></head><body>
